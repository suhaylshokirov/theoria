<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;">
  <tr>
    <td align="center" style="padding:40px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;">
        <tr>
          <td style="font-family:Arial, Helvetica, sans-serif; font-size:15px; color:#111111; padding-bottom:20px;">
            {% if purpose == "signup" %}Confirm your Theoria account{% else %}Sign in to Theoria{% endif %}
          </td>
        </tr>
        <tr>
          <td align="center" style="border:1px solid #dddddd; border-radius:6px; padding:24px 0;">
            <span style="font-family:'Courier New', Courier, monospace; font-size:28px; letter-spacing:10px; font-weight:bold; color:#111111;">{{ code }}</span>
          </td>
        </tr>
        <tr>
          <td style="font-family:Arial, Helvetica, sans-serif; font-size:13px; color:#666666; padding-top:20px;">
            This code expires in 10 minutes. If you didn't request it, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
