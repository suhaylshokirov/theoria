<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;">
  <tr>
    <td align="center" style="padding:40px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;">
        <tr>
          <td style="font-family:Arial, Helvetica, sans-serif; font-size:11px; font-weight:bold; color:#0b0b0b; letter-spacing:3px; text-transform:uppercase; padding-bottom:16px;">
            Theoria
          </td>
        </tr>
        <tr>
          <td style="font-family:Arial, Helvetica, sans-serif; font-size:15px; color:#0b0b0b; padding-bottom:20px;">
            {% if purpose == "signup" %}Confirm your Theoria account{% else %}Sign in to Theoria{% endif %}
          </td>
        </tr>
        <tr>
          <td align="center" style="background-color:#f2fbe0; border:1px solid #a3e635; border-radius:4px; padding:24px 0;">
            <span style="font-family:'Courier New', Courier, monospace; font-size:28px; letter-spacing:10px; font-weight:bold; color:#0b0b0b;">{{ code }}</span>
          </td>
        </tr>
        <tr>
          <td style="font-family:Arial, Helvetica, sans-serif; font-size:13px; color:#57534e; padding-top:20px;">
            This code expires in 10 minutes. If you didn't request it, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
