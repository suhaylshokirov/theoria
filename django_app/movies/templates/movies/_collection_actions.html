{% load i18n %}<div class="collection-actions" aria-label="{% translate "Personal collections" %}">
    <form method="post" action="{% url 'account:toggle_collection' kind='liked' content_type=content_type content_id=content_id %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button aria-label="{% translate "Like" %}" class="collection-action collection-action--like{% if collection_flags.liked %} is-selected{% endif %}" type="submit"{% if collection_flags.liked %} aria-pressed="true"{% else %} aria-pressed="false"{% endif %}>
            <span class="collection-action__icon" aria-hidden="true"></span>
            <span class="collection-action__label collection-action__label--off">{% translate "Like" %}</span>
            <span class="collection-action__label collection-action__label--on">{% translate "Liked" %}</span>
        </button>
    </form>
    <form method="post" action="{% url 'account:toggle_collection' kind='watch_later' content_type=content_type content_id=content_id %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button aria-label="{% translate "Watch later" %}" class="collection-action collection-action--watch-later{% if collection_flags.watch_later %} is-selected{% endif %}" type="submit"{% if collection_flags.watch_later %} aria-pressed="true"{% else %} aria-pressed="false"{% endif %}>
            <span class="collection-action__icon" aria-hidden="true"></span>
            <span class="collection-action__label collection-action__label--off">{% translate "Watch later" %}</span>
            <span class="collection-action__label collection-action__label--on">{% translate "In Watch later" %}</span>
        </button>
    </form>
    <form method="post" action="{% url 'account:toggle_collection' kind='top' content_type=content_type content_id=content_id %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button aria-label="{% translate "Add to top" %}" class="collection-action collection-action--top{% if collection_flags.top %} is-selected{% endif %}" type="submit"{% if collection_flags.top %} aria-pressed="true"{% else %} aria-pressed="false"{% endif %}>
            <span class="collection-action__icon" aria-hidden="true"></span>
            <span class="collection-action__label collection-action__label--off">{% translate "Add to top" %}</span>
            <span class="collection-action__label collection-action__label--on">{% translate "In your Top" %}</span>
        </button>
    </form>
</div>
