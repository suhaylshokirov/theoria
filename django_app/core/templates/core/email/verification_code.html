<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f7f7f5;font-family:'Instrument Sans',Arial,sans-serif;color:#0b0b0b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f5;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #e3e2dd;">
          <tr>
            <td style="padding:28px 32px 0 32px;">
              <span style="font-family:Arial,sans-serif;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#78716c;">Theoria</span>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 32px 0 32px;">
              <h1 style="margin:0;font-size:20px;line-height:1.3;">Your verification code</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 0 32px;">
              <div style="font-family:'Spline Sans Mono',ui-monospace,monospace;font-size:32px;letter-spacing:0.12em;background:#f2fbe0;color:#365314;border-left:2px solid #65a30d;padding:16px 20px;">{{ code }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 32px 32px;font-size:14px;line-height:1.5;color:#57534e;">
              <p style="margin:0 0 8px 0;">It expires in {{ ttl_minutes }} minutes and can be used once.</p>
              <p style="margin:0;">If you didn't request this, you can ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
