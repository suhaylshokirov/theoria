name: nightly-refresh

# Refresh every film already in the warehouse: re-fetch its TMDB details +
# credits and today's IMDb ratings snapshot, rebuild Silver/Gold, upsert the
# warehouse, and append a dated volatile-metrics snapshot to the lake.
#
# The whole run is idempotent per ingestion_date, so a retry (or an overlap
# with a manual dispatch) is safe.

on:
  schedule:
    # 03:12 UTC daily. Not on the hour: GitHub delays cron under load, and a
    # non-round minute is less likely to sit in the worst of that queue.
    - cron: "12 3 * * *"
  workflow_dispatch: {}

# GitHub silently disables scheduled workflows on a public repo after 60 days
# with no repository activity. The final step commits a one-line run summary,
# which counts as activity and resets that clock. `contents: write` is for
# that commit and nothing else.
permissions:
  contents: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ~30-40 min in practice (the runner is US-hosted, the bucket is in
    # eu-central-1). 90 is headroom, not the expected runtime.
    timeout-minutes: 90

    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-etl.txt

      - name: Verify configuration
        run: python -c "import config; config.require_etl(); print('config OK')"

      - name: Run refresh pipeline
        run: python -m scripts.run_refresh

      - name: Record run summary
        if: always()
        run: |
          mkdir -p ops
          printf '%s  %s  run %s  (%s)\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ job.status }}" \
            "${{ github.run_number }}" \
            "${{ github.event_name }}" \
            >> ops/refresh-history.md
          git config user.name  "theoria-refresh-bot"
          git config user.email "theoria-refresh-bot@users.noreply.github.com"
          git add ops/refresh-history.md
          git commit -m "nightly-refresh: run ${{ github.run_number }} [skip ci]" || exit 0
          git push
